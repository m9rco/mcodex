name: Official Codex engine launch checks (protocol acceptance is separate)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      codex_version:
        description: Exact official version for launch-only inspection; full protocol acceptance runs in the gateway repository
        required: false
        default: '0.163.0'

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codex: ['0.162.1', '0.163.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --omit=optional --ignore-scripts
      - name: Install an isolated official engine
        env:
          CODEX_VERSION: ${{ matrix.codex }}
        run: npm install --prefix "$RUNNER_TEMP/codex-engine" --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund "@openai/codex@$CODEX_VERSION"
      - name: Inspect the actual engine without gateway credentials
        env:
          MCODEX_CODEX_BIN: ${{ runner.temp }}/codex-engine/node_modules/@openai/codex/bin/codex.js
        run: node bin/mcodex.js engine status
      - run: node --test test/engine.test.js test/tunnel.test.js test/cli-flow.test.js

  inspect-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate explicit version and install in isolation
        env:
          CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          node <<'JS'
          const version = process.env.CODEX_VERSION;
          const numeric = '(?:0|[1-9][0-9]*)';
          const identifier = '(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)';
          const exact = new RegExp(`^${numeric}\\.${numeric}\\.${numeric}(?:-${identifier}(?:\\.${identifier})*)?$`);
          if (!exact.test(version) || version.trim() !== version) throw new Error('Select an exact Codex version, not a tag or version range');
          JS
          npm install --prefix "$RUNNER_TEMP/codex-engine" --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund "@openai/codex@$CODEX_VERSION"
      - name: Report candidate status without activating it
        env:
          MCODEX_CODEX_BIN: ${{ runner.temp }}/codex-engine/node_modules/@openai/codex/bin/codex.js
        run: |
          node bin/mcodex.js engine status
          echo 'Scope: executable identity and launch only. Full Responses, tools, compaction, resume and cancellation acceptance must pass the gateway compatibility workflow before this version is added to the tested manifest or bundled.'
